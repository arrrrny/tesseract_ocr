name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  # Dart side of the plugin: analyzer + the test suite. The suite also carries the
  # iOS Swift source-invariant tests (tessdata preflight, EngineMode case,
  # TessBaseAPI lifetime inside the dispatched closure, the podspec compiling the
  # shared Sources/ copy), so a regression that would not compile on iOS fails
  # here even though nothing on Linux compiles Swift.
  #
  # `flutter analyze` is informational (continue-on-error): the stable Flutter
  # that setup pulls marks `package:flutter/material.dart` itself as deprecated,
  # which reports as an info-level issue and makes `flutter analyze` exit 1 for
  # the example app — unrelated to this PR. The test step is the hard gate.
  dart:
    name: dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: flutter analyze (informational)
        continue-on-error: true
        run: flutter analyze
      - run: flutter test --concurrency=2

  # iOS plugin source gate. Nothing here compiles the plugin, and that is a
  # property of this repo, not an omission:
  #
  # - `swift build` cannot work: the SwiftPM target compiles
  #   Sources/tesseract_ocr/*.swift, a Flutter plugin that imports Flutter — a
  #   module plain SwiftPM cannot resolve (it dies with `no such module 'Flutter'`).
  # - `pod lib lint` cannot work: the podspec depends on `SwiftyTesseract401`,
  #   served by the sibling SwiftyTesseract401.podspec in this repo rather than
  #   the trunk CDN, and CocoaPods' `--sources` takes spec-repo URLs/names, not
  #   filesystem paths.
  # - `flutter build ios` cannot work: the vendored `libtesseract` path pod needs
  #   libtesseract.xcframework, a binary artifact deliberately not committed, so
  #   `pod install` fails on a fresh checkout.
  #
  # So this job asserts the structural properties that keep the source
  # compilable in the host app (where Flutter and the pods really exist).
  ios-source:
    name: ios source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift plugin source structure
        run: |
          set -euo pipefail
          src="Sources/tesseract_ocr/SwiftTesseractOcrPlugin.swift"
          test -f "$src"
          # A Flutter plugin source that stops importing Flutter is no longer a
          # Flutter plugin; the host app compiles this file, not SwiftPM.
          grep -q '^import Flutter$' "$src"
          # The iOS podspec must compile the shared Sources/ copy (the old
          # byte-identical ios/Classes duplicate is gone) and declare the pods
          # that provide Flutter and SwiftyTesseract.
          grep -q "s.source_files = 'Sources/tesseract_ocr/\\*.swift'" ios/tesseract_ocr.podspec
          grep -q "s.dependency 'Flutter'" ios/tesseract_ocr.podspec
          grep -q "s.dependency 'SwiftyTesseract401'" ios/tesseract_ocr.podspec
          # Every Swift file the podspec names must exist.
          for f in Sources/tesseract_ocr/*.swift; do test -f "$f"; done
          # Braces, parens and brackets balance — a truncated or hand-mangled
          # source fails here instead of as a confusing link error.
          python3 - "$src" <<'PYEOF'
          import sys
          s = open(sys.argv[1]).read()
          for o, c in (('{', '}'), ('(', ')'), ('[', ']')):
              if s.count(o) != s.count(c):
                  sys.exit(f"unbalanced {o}{c} in {sys.argv[1]}")
          PYEOF
          echo "ios source structure OK"
