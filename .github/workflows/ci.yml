name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  # Real compile gate for the Apple (Darwin) plugin source.
  #
  # A bare `swift build` cannot be used: the SwiftPM target compiles
  # Sources/tesseract_ocr/*.swift, which is a Flutter plugin and imports Flutter —
  # a module plain SwiftPM has no way to resolve, so the step died with
  # `no such module 'Flutter'` before ever reaching our code. `pod lib lint` is
  # not a substitute either: the `SwiftyTesseract401` dependency is served by the
  # sibling SwiftyTesseract401.podspec in this repo, not by the trunk CDN, and
  # CocoaPods' `--sources` takes spec repo URLs/names, not filesystem paths, so
  # the lint failed with "Unable to find a specification for SwiftyTesseract401".
  #
  # The plugin is really compiled by CocoaPods inside the host app, so the gate
  # reproduces exactly that: build the example app's iOS Runner scheme for the
  # simulator, which runs `pod install` (resolving Flutter, the sibling
  # SwiftyTesseract401 podspec and the vendored libtesseract path) and then
  # compiles Sources/tesseract_ocr/SwiftTesseractOcrPlugin.swift. The substring
  # tests in test/tesseract_ocr_test.dart only read the Swift source as text;
  # this is the step that catches a plugin source that does not compile.
  ios-build:
    name: ios build (example Runner)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build ios --simulator --no-codesign
        working-directory: example
        run: flutter build ios --simulator --no-codesign

  # Dart/flutter side of the plugin.
  dart:
    name: dart test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=2